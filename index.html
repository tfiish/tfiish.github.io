<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tfiish</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="description" content="A fish.">
  <style>
    /* The arcade theme's colors, fixed: the fish is drawn in them, so it always swims in its own water. */
    :root {
      color-scheme: dark;
      --bg: #120f22;
      --fg: #f2eefc;
      --accent: #c4ff3d;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); margin: 0; }
    .pond { width: 100%; padding: 0 16px; text-align: right; }
    .fish { position: relative; display: inline-block; padding: 0; border: 0; background: none; cursor: pointer; transition: translate var(--dur, 1.3s) ease-in-out; }
    .ow { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); color: var(--fg); font-size: 1rem; opacity: 0; pointer-events: none; }
    @keyframes ow { from { opacity: 1; } to { opacity: 0; translate: 0 -8px; } }
    .fish.hurt .ow { animation: ow 1s ease-in; }
    .fish svg { display: block; opacity: .85; }
    .fish:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    /* The fish swims to points anywhere in the pond (translate is set from script), facing the way it went and
       tilting toward where it's headed. .left flips it to face left. */
    .fish svg { transition: rotate .4s ease-out; rotate: var(--tilt, 0deg); }
    .fish.left svg { transform: scaleX(-1); }
    @keyframes bob { 50% { translate: 0 -3px; } }
    .fish.swimming:not(.stunned) svg { animation: bob .6s ease-in-out infinite; }
    /* A stunned fish holds still with an x for an eye until it's poked again. */
    .fish .x, .fish.stunned .eye { display: none; }
    .fish.stunned .x { display: inline; }
    @media (prefers-reduced-motion: reduce) { .fish { transition: none; } .fish.swimming svg { animation: none; } @keyframes ow { from { opacity: 1; } to { opacity: 0; } } }
  </style>
</head>
<body>
  <!-- Nothing but the fish. The side-projects list is at /projects/, and SleekSleep's pages are at /sleeksleep/;
       neither is linked from here. The fish is the one from favicon.svg and the projects page's footer. -->
  <h1>tfiish</h1>
  <div class="pond">
    <button class="fish" id="fish" type="button" aria-label="Poke the fish">
      <svg viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges" aria-hidden="true">
        <g fill="#c4ff3d">
          <rect x="7" y="4" width="4" height="1"/>
          <rect x="6" y="5" width="6" height="1"/>
          <rect x="5" y="6" width="8" height="1"/>
          <rect x="4" y="7" width="10" height="2"/>
          <rect x="5" y="9" width="8" height="1"/>
          <rect x="6" y="10" width="6" height="1"/>
          <rect x="7" y="11" width="4" height="1"/>
          <rect x="2" y="5" width="1" height="1"/>
          <rect x="2" y="6" width="2" height="1"/>
          <rect x="2" y="9" width="2" height="1"/>
          <rect x="2" y="10" width="1" height="1"/>
        </g>
        <rect class="eye" x="11" y="6" width="1" height="1" fill="#7df9ff"/>
        <g class="x" fill="#120f22">
          <rect x="9" y="5" width="1" height="1"/>
          <rect x="11" y="5" width="1" height="1"/>
          <rect x="10" y="6" width="1" height="1"/>
          <rect x="9" y="7" width="1" height="1"/>
          <rect x="11" y="7" width="1" height="1"/>
        </g>
      </svg>
      <span class="ow" aria-hidden="true">ow</span>
    </button>
  </div>
  <script>
    (function () {
      // The projects page's fish, given the whole pond. A mouse coming near sends it off to some other spot, picked
      // to be well away from the mouse, where it waits to be disturbed again. Poking it stuns it in place; poking
      // it again sends it on its way. It swims at the footer fish's speed, so a big window means a longer swim.
      var fish = document.getElementById('fish');
      var still = matchMedia('(prefers-reduced-motion: reduce)');
      var NEAR = 96;
      var SPEED = 640; // px per second
      var MARGIN = 16;
      var spanX = 0, spanY = 0;
      var at = { x: 0, y: 0 };     // where the fish rests, or is headed, relative to its home at the right edge
      function measure() {
        spanX = Math.max(0, fish.parentNode.clientWidth - 2 * MARGIN - fish.offsetWidth);
        spanY = Math.max(0, (document.documentElement.clientHeight - fish.offsetHeight) / 2 - MARGIN);
      }
      function place(x, y) { fish.style.translate = x + 'px ' + y + 'px'; }
      function duration(d) { return Math.max(.4, d / SPEED) + 's'; }
      // Several random spots; the one farthest from the mouse wins, as long as it's a real swim.
      function pick(from) {
        var best = null, bestScore = -1;
        for (var i = 0; i < 8; i++) {
          var c = { x: -Math.random() * spanX, y: (Math.random() * 2 - 1) * spanY };
          var travel = Math.hypot(c.x - at.x, c.y - at.y);
          if (travel < Math.min(160, spanX / 2 + spanY)) continue;
          var score = from ? Math.hypot(c.x - from.x, c.y - from.y) : Math.random();
          if (score > bestScore) { best = c; bestScore = score; }
        }
        return best || { x: at.x ? 0 : -spanX, y: -at.y };
      }
      function swim(from) {
        if (still.matches || fish.classList.contains('swimming') || fish.classList.contains('stunned')) return;
        measure();
        var to = pick(from);
        var dx = to.x - at.x, dy = to.y - at.y;
        if (Math.abs(dx) > 1) fish.classList.toggle('left', dx < 0);
        // Nose toward the destination: rotation is in screen terms, so a fish facing left tilts the other way.
        var tilt = Math.max(-40, Math.min(40, Math.atan2(dy, Math.abs(dx)) * 180 / Math.PI));
        fish.style.setProperty('--tilt', (fish.classList.contains('left') ? -tilt : tilt) + 'deg');
        fish.style.transitionDuration = duration(Math.hypot(dx, dy));
        fish.classList.add('swimming');
        at = to;
        place(to.x, to.y);
      }
      function landed() {
        fish.classList.remove('swimming');
        fish.style.transitionDuration = '';
        fish.style.removeProperty('--tilt');
      }
      document.addEventListener('pointermove', function (e) {
        if (e.pointerType !== 'mouse') return;
        var r = fish.getBoundingClientRect();
        var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        if (Math.hypot(e.clientX - cx, e.clientY - cy) < NEAR) {
          // The mouse in the fish's own coordinates (relative to home), so spots can be compared with it.
          swim({ x: at.x + e.clientX - cx, y: at.y + e.clientY - cy });
        }
      }, { passive: true });
      function ow() {
        fish.classList.remove('hurt');
        void fish.offsetWidth;
        fish.classList.add('hurt');
      }
      function poke() {
        if (!fish.classList.contains('stunned')) {
          // Pinning the mid-swim position inline, with transitions off, stops the fish right where it is.
          if (fish.classList.contains('swimming')) {
            var here = getComputedStyle(fish).translate;
            fish.style.transition = 'none';
            fish.style.translate = here;
          }
          fish.classList.add('stunned');
          ow();
          return;
        }
        fish.classList.remove('stunned');
        if (!fish.classList.contains('swimming')) return swim();
        // Finish the interrupted swim at the same speed: the time left scales with the distance left.
        measure();
        var here = (fish.style.translate || '0px 0px').split(' ').map(parseFloat);
        var left = Math.hypot(at.x - here[0], at.y - (here[1] || 0));
        fish.style.transition = '';
        if (left < 1) return landed();
        fish.style.transitionDuration = duration(left);
        place(at.x, at.y);
      }
      // pointerdown counts a press on a fish that swims off before the click would land;
      // a click with no pointer behind it (detail 0) is the keyboard.
      fish.addEventListener('pointerdown', poke);
      fish.addEventListener('click', function (e) {
        if (e.detail === 0) poke();
      });
      fish.addEventListener('transitionend', function (e) {
        if (e.target === fish && e.propertyName === 'translate') landed();
      });
      fish.addEventListener('animationend', function (e) {
        if (e.animationName === 'ow') fish.classList.remove('hurt');
      });
      // A resized pond keeps a resting fish inside it.
      addEventListener('resize', function () {
        measure();
        if (fish.classList.contains('swimming')) return;
        at = { x: Math.max(at.x, -spanX), y: Math.max(-spanY, Math.min(spanY, at.y)) };
        place(at.x, at.y);
      });
      measure();
    })();
  </script>
</body>
</html>
